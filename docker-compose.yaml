version: '3.9'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      - SA_PASSWORD=Sidd@521
      - ACCEPT_EULA=Y
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  assetapi:
    build: .
    container_name: assetapi
    ports:
      - "5114:8080"   # HTTP
      - "7092:8081"   # HTTPS
    volumes:
    - ./https:/https:ro
    environment:
      - ASPNETCORE_URLS=http://+:8080;https://+:8081
      - DB_USER=sa
      - DB_PASSWORD=Sidd@521
      - JWT_KEY=YOUKNOWIFYKNOW%^%$POIUYTGHJUYTGHUTHJUYHUYGNKIYNIIU
      - ASPNETCORE_Kestrel__Certificates__Default__Password=Sidd@521
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/aspnetapp.pfx
    depends_on:
      - sqlserver
   

volumes:
  sql_data: